name = "http"
grammar = "http"
path_suffixes = ["http", "http-resp"]
line_comments = ["# ", "// "]

brackets = [
    { start = "\"", end = "\"", close = true, newline = false },
    { start = "{", end = "}", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
]
