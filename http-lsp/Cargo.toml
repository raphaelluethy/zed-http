[package]
name = "zed-http-lsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
description = "Language server for interactive .http request execution in Zed"
publish = false

[[bin]]
name = "zed-http-lsp"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dashmap = "5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
] }
tower-lsp = "0.20"
