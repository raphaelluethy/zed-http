[package]
name = "zed-http-lsp"
version = "0.0.3"
edition = "2021"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "Zed editor adapter for Kulala Core request execution"

[[bin]]
name = "zed-http-lsp"
path = "src/main.rs"

[dependencies]
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tower-lsp = "0.20"
