[package]
name = "zed-http-lsp"
version = "0.1.1"
edition = "2021"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "Zed editor adapter that parses and executes .http requests"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zed-http-lsp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
boa_engine = { version = "0.22", default-features = false }
encoding_rs = "0.8"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
md-5 = "0.10"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
    "brotli",
    "charset",
    "cookies",
    "deflate",
    "gzip",
    "http2",
    "multipart",
    "rustls-no-provider",
    "stream",
    "zstd",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_json_path = "0.7"
sha1 = "0.10"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-reflection = { version = "0.14", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-lsp = "0.20"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["router", "server"] }
tonic-prost = "0.14"
tonic-reflection = "0.14"
tower-http = { version = "0.6", features = ["compression-gzip"] }
