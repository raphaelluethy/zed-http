[workspace]
members = [".", "http-lsp"]
default-members = ["."]
resolver = "2"

[package]
name = "zed_http"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false
license = "Apache-2.0"

[lib]
path = "src/http.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
