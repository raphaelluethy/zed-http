name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

env:
    CARGO_TERM_COLOR: always

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@1.98.0
              with:
                  targets: wasm32-wasip2
                  components: rustfmt, clippy
            - run: cargo fmt --all --check
            - run: cargo test --locked --workspace --all-targets
            - run: cargo build --locked --target wasm32-wasip2

    build-lsp:
        needs: verify
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - runner: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-gnu
                    - runner: macos-15-intel
                      target: x86_64-apple-darwin
                    - runner: macos-latest
                      target: aarch64-apple-darwin
                    - runner: windows-latest
                      target: x86_64-pc-windows-msvc
                    - runner: windows-11-arm
                      target: aarch64-pc-windows-msvc
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@1.98.0
              with:
                  targets: ${{ matrix.target }}
            - run: cargo build --locked --release --package zed-http-lsp --target ${{ matrix.target }}
            - name: Package Unix binary
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  mkdir -p dist
                  tar -C "target/${{ matrix.target }}/release" \
                    -czf "dist/zed-http-lsp-${{ matrix.target }}.tar.gz" \
                    zed-http-lsp
            - name: Package Windows binary
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path dist
                  Compress-Archive `
                    -Path "target/${{ matrix.target }}/release/zed-http-lsp.exe" `
                    -DestinationPath "dist/zed-http-lsp-${{ matrix.target }}.zip"
            - uses: actions/upload-artifact@v4
              with:
                  name: zed-http-lsp-${{ matrix.target }}
                  path: dist/*
                  if-no-files-found: error

    publish:
        needs: build-lsp
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
