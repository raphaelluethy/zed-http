name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
              with:
                  targets: wasm32-wasip2
                  components: rustfmt, clippy
            - run: cargo fmt --all --check
            - run: cargo clippy --locked --workspace --all-targets -- -D warnings
            - run: cargo test --locked --workspace --all-targets
            - run: cargo build --locked --target wasm32-wasip2
            - run: cargo build --locked --package zed-http-lsp
            - run: node scripts/smoke_lsp.cjs
            - name: Verify release versions
              shell: bash
              run: |
                  tag_version="${GITHUB_REF_NAME#v}"
                  lsp_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' http-lsp/Cargo.toml | head -1)
                  extension_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' extension.toml | head -1)
                  launcher_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
                  test "$tag_version" = "$lsp_version"
                  test "$tag_version" = "$extension_version"
                  test "$tag_version" = "$launcher_version"

    build-lsp:
        needs: verify
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - runner: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-gnu
                    - runner: macos-15-intel
                      target: x86_64-apple-darwin
                    - runner: macos-latest
                      target: aarch64-apple-darwin
                    - runner: windows-latest
                      target: x86_64-pc-windows-msvc
                    - runner: windows-11-arm
                      target: aarch64-pc-windows-msvc
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - uses: dtolnay/rust-toolchain@75be91dd2711b583df57c31d0873b4145c89f1d9 # 1.94.1
              with:
                  targets: ${{ matrix.target }}
            - run: cargo build --locked --release --package zed-http-lsp --target ${{ matrix.target }}
            - name: Package Unix server
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  mkdir -p dist
                  if [[ "${{ runner.os }}" == "macOS" ]]; then
                    codesign --force --sign - "target/${{ matrix.target }}/release/zed-http-lsp"
                  fi
                  tar -C "target/${{ matrix.target }}/release" \
                    -czf "dist/zed-http-lsp-${{ matrix.target }}.tar.gz" \
                    zed-http-lsp
            - name: Package Windows server
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path dist
                  Compress-Archive `
                    -Path "target/${{ matrix.target }}/release/zed-http-lsp.exe" `
                    -DestinationPath "dist/zed-http-lsp-${{ matrix.target }}.zip"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: zed-http-lsp-${{ matrix.target }}
                  path: dist/*
                  if-no-files-found: error

    publish:
        needs: build-lsp
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: dist
                  merge-multiple: true
            - name: Generate archive checksums
              working-directory: dist
              run: sha256sum * > SHA256SUMS
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
